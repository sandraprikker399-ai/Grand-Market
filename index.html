<!-- =========================================================
     REPORTS + STAFF MANAGEMENT
     Replace your existing Reports and Staff Management sections
     with everything below.
========================================================= -->

<section id="reportsSection" class="admin-section" style="display:none;">
  <div class="section-header">
    <div>
      <h2>Player Reports</h2>
      <p>View and manage reports submitted by players.</p>
    </div>
    <button onclick="loadReports()">Refresh</button>
  </div>

  <div id="reportsContainer">
    <div class="loading-box">Loading reports...</div>
  </div>
</section>


<section id="staffManagementSection" class="admin-section" style="display:none;">
  <div class="section-header">
    <div>
      <h2>Staff Management</h2>
      <p>Manage administrator and moderator roles.</p>
    </div>
    <button onclick="loadStaffMembers()">Refresh</button>
  </div>

  <div id="staffContainer">
    <div class="loading-box">Loading staff...</div>
  </div>
</section>


<style>
  .admin-section {
    width: 100%;
    margin-top: 20px;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
  }

  .section-header h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }

  .section-header p {
    margin: 5px 0 0;
    opacity: .7;
    font-size: 14px;
  }

  .section-header button {
    border: 0;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
    background: rgba(255,255,255,.08);
    color: inherit;
  }

  .loading-box,
  .empty-box,
  .error-box {
    padding: 25px;
    border-radius: 15px;
    background: rgba(255,255,255,.05);
    text-align: center;
  }

  .report-card,
  .staff-card {
    padding: 18px;
    margin-bottom: 12px;
    border-radius: 16px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
  }

  .report-top,
  .staff-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
  }

  .player-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .player-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: rgba(255,255,255,.08);
  }

  .player-name {
    font-size: 15px;
    font-weight: 600;
  }

  .player-role {
    margin-top: 3px;
    font-size: 12px;
    opacity: .65;
  }

  .report-reason {
    margin: 15px 0 8px;
    font-size: 14px;
  }

  .report-message {
    padding: 12px;
    border-radius: 10px;
    background: rgba(0,0,0,.12);
    font-size: 13px;
    line-height: 1.5;
  }

  .report-actions,
  .staff-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .admin-btn {
    border: 0;
    border-radius: 9px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
    background: rgba(255,255,255,.09);
    color: inherit;
  }

  .admin-btn.danger {
    background: rgba(255,70,70,.15);
  }

  .admin-btn.success {
    background: rgba(70,220,130,.15);
  }

  .role-select {
    border: 0;
    border-radius: 9px;
    padding: 9px;
    background: rgba(255,255,255,.08);
    color: inherit;
    outline: none;
  }

  .role-select option {
    background: #171717;
    color: white;
  }

  .status-badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 11px;
    background: rgba(255,255,255,.08);
  }

  .status-pending {
    background: rgba(255,190,60,.15);
  }

  .status-resolved {
    background: rgba(70,220,130,.15);
  }
</style>


<script>
/* =========================================================
   REPORTS + STAFF MANAGEMENT JAVASCRIPT
========================================================= */

let currentUserProfile = null;


/* ---------------------------------------------------------
   GET CURRENT USER + PROFILE
--------------------------------------------------------- */

async function getCurrentStaffProfile() {
  try {
    const {
      data: { user },
      error: authError
    } = await supabase.auth.getUser();

    if (authError || !user) {
      console.log("No logged-in user.");
      return null;
    }

    const { data, error } = await supabase
      .from("profiles")
      .select("*")
      .eq("user_id", user.id)
      .single();

    if (error) {
      console.error(error);
      return null;
    }

    currentUserProfile = data;
    return data;

  } catch (error) {
    console.error(error);
    return null;
  }
}


/* ---------------------------------------------------------
   ROLE CHECK
--------------------------------------------------------- */

function isOwner() {
  return currentUserProfile &&
    String(currentUserProfile.role || "").toLowerCase() === "owner";
}

function isAdmin() {
  if (!currentUserProfile) return false;

  const role = String(currentUserProfile.role || "").toLowerCase();

  return role === "owner" || role === "admin";
}

function isModerator() {
  if (!currentUserProfile) return false;

  const role = String(currentUserProfile.role || "").toLowerCase();

  return role === "owner" ||
         role === "admin" ||
         role === "moderator";
}


/* ---------------------------------------------------------
   SHOW / HIDE STAFF AREAS
--------------------------------------------------------- */

async function initializeStaffPanel() {

  await getCurrentStaffProfile();

  const reports = document.getElementById("reportsSection");
  const staff = document.getElementById("staffManagementSection");

  if (!currentUserProfile) {
    if (reports) reports.style.display = "none";
    if (staff) staff.style.display = "none";
    return;
  }

  if (isModerator()) {
    if (reports) reports.style.display = "block";
  }

  if (isAdmin()) {
    if (staff) staff.style.display = "block";
  }

  if (isModerator()) {
    loadReports();
  }

  if (isAdmin()) {
    loadStaffMembers();
  }
}


/* ---------------------------------------------------------
   LOAD REPORTS
--------------------------------------------------------- */

async function loadReports() {

  const container = document.getElementById("reportsContainer");

  if (!container) return;

  if (!isModerator()) {
    container.innerHTML =
      '<div class="error-box">You do not have permission to view reports.</div>';
    return;
  }

  container.innerHTML =
    '<div class="loading-box">Loading reports...</div>';

  try {

    const { data, error } = await supabase
      .from("reports")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) throw error;

    if (!data || data.length === 0) {
      container.innerHTML =
        '<div class="empty-box">No reports found.</div>';
      return;
    }

    container.innerHTML = data.map(report => {

      const status =
        String(report.status || "pending").toLowerCase();

      return `
        <div class="report-card">

          <div class="report-top">

            <div class="player-info">

              <div>
                <div class="player-name">
                  ${escapeHTML(
                    report.reporter_name ||
                    report.name ||
                    "Player"
                  )}
                </div>

                <div class="player-role">
                  Report ID: ${escapeHTML(String(report.id || ""))}
                </div>
              </div>

            </div>

            <span class="status-badge ${
              status === "resolved"
              ? "status-resolved"
              : "status-pending"
            }">
              ${escapeHTML(status)}
            </span>

          </div>

          <div class="report-reason">
            <strong>Reason:</strong>
            ${escapeHTML(report.reason || "No reason provided")}
          </div>

          <div class="report-message">
            ${escapeHTML(report.message || "No additional details.")}
          </div>

          <div class="report-actions">

            ${
              status !== "resolved"
              ? `
                <button
                  class="admin-btn success"
                  onclick="resolveReport('${report.id}')">
                  Mark Resolved
                </button>
              `
              : ""
            }

            ${
              isAdmin()
              ? `
                <button
                  class="admin-btn danger"
                  onclick="deleteReport('${report.id}')">
                  Delete
                </button>
              `
              : ""
            }

          </div>

        </div>
      `;

    }).join("");

  } catch (error) {

    console.error("Reports error:", error);

    container.innerHTML =
      '<div class="error-box">Unable to load reports.</div>';
  }
}


/* ---------------------------------------------------------
   RESOLVE REPORT
--------------------------------------------------------- */

async function resolveReport(reportId) {

  if (!isModerator()) {
    alert("You do not have permission.");
    return;
  }

  try {

    const { error } = await supabase
      .from("reports")
      .update({
        status: "resolved"
      })
      .eq("id", reportId);

    if (error) throw error;

    await loadReports();

  } catch (error) {

    console.error(error);
    alert("Failed to update report.");
  }
}


/* ---------------------------------------------------------
   DELETE REPORT
--------------------------------------------------------- */

async function deleteReport(reportId) {

  if (!isAdmin()) {
    alert("Only Admins and Owners can delete reports.");
    return;
  }

  if (!confirm("Delete this report?")) return;

  try {

    const { error } = await supabase
      .from("reports")
      .delete()
      .eq("id", reportId);

    if (error) throw error;

    await loadReports();

  } catch (error) {

    console.error(error);
    alert("Failed to delete report.");
  }
}


/* ---------------------------------------------------------
   LOAD STAFF
--------------------------------------------------------- */

async function loadStaffMembers() {

  const container = document.getElementById("staffContainer");

  if (!container) return;

  if (!isAdmin()) {
    container.innerHTML =
      '<div class="error-box">You do not have permission to manage staff.</div>';
    return;
  }

  container.innerHTML =
    '<div class="loading-box">Loading staff...</div>';

  try {

    const { data, error } = await supabase
      .from("profiles")
      .select("*")
      .in("role", ["owner", "admin", "moderator"])
      .order("created_at", { ascending: true });

    if (error) throw error;

    if (!data || data.length === 0) {
      container.innerHTML =
        '<div class="empty-box">No staff members found.</div>';
      return;
    }

    container.innerHTML = data.map(member => {

      const role =
        String(member.role || "user").toLowerCase();

      const name =
        member.Display_Name ||
        member.display_name ||
        member.name ||
        "Unnamed Player";

      const avatar =
        member.avatar_url ||
        member.profile_picture ||
        "";

      const isSelf =
        currentUserProfile &&
        member.user_id === currentUserProfile.user_id;

      return `
        <div class="staff-card">

          <div class="staff-top">

            <div class="player-info">

              ${
                avatar
                ? `<img
                    class="player-avatar"
                    src="${escapeAttribute(avatar)}"
                    onerror="this.style.display='none';"
                   >`
                : ""
              }

              <div>

                <div class="player-name">
                  ${escapeHTML(name)}
                </div>

                <div class="player-role">
                  Current role:
                  <strong>${escapeHTML(role)}</strong>
                </div>

              </div>

            </div>

          </div>

          <div class="staff-actions">

            ${
              isOwner()
              ? `
                <select
                  class="role-select"
                  id="role-${member.user_id}">

                  <option value="user"
                    ${role === "user" ? "selected" : ""}>
                    User
                  </option>

                  <option value="moderator"
                    ${role === "moderator" ? "selected" : ""}>
                    Moderator
                  </option>

                  <option value="admin"
                    ${role === "admin" ? "selected" : ""}>
                    Admin
                  </option>

                  <option value="owner"
                    ${role === "owner" ? "selected" : ""}>
                    Owner
                  </option>

                </select>

                <button
                  class="admin-btn success"
                  onclick="changePlayerRole('${member.user_id}')">
                  Save Role
                </button>
              `
              :
              `
                <span class="status-badge">
                  ${
                    isSelf
                    ? "Your Account"
                    : "Owner Controlled"
                  }
                </span>
              `
            }

          </div>

        </div>
      `;

    }).join("");

  } catch (error) {

    console.error("Staff error:", error);

    container.innerHTML =
      '<div class="error-box">Unable to load staff members.</div>';
  }
}


/* ---------------------------------------------------------
   CHANGE PLAYER ROLE
--------------------------------------------------------- */

async function changePlayerRole(userId) {

  if (!isOwner()) {
    alert("Only the Owner can change staff roles.");
    return;
  }

  if (!userId) return;

  const select =
    document.getElementById(`role-${userId}`);

  if (!select) return;

  const newRole = select.value;

  if (
    !["user", "moderator", "admin", "owner"].includes(newRole)
  ) {
    alert("Invalid role.");
    return;
  }

  if (userId === currentUserProfile.user_id &&
      newRole !== "owner") {

    alert("You cannot remove your own Owner role.");
    return;
  }

  if (
    !confirm(`Change this player's role to ${newRole}?`)
  ) {
    return;
  }

  try {

    const { error } = await supabase
      .from("profiles")
      .update({
        role: newRole
      })
      .eq("user_id", userId);

    if (error) throw error;

    alert("Role updated successfully.");

    await loadStaffMembers();

  } catch (error) {

    console.error("Role update error:", error);

    alert(
      "Role update failed. Check your Supabase RLS policies."
    );
  }
}


/* ---------------------------------------------------------
   ESCAPE HTML
--------------------------------------------------------- */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

  return String(value ?? "")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

document.addEventListener("DOMContentLoaded", () => {
  initializeStaffPanel();
});
  </script>
